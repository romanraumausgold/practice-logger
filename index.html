<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Practice">
<title>Practice Logger</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0d0b;
  --surface: #161512;
  --border: rgba(255,255,255,0.07);
  --border-active: rgba(212,182,118,0.5);
  --gold: #d4b676;
  --gold-dim: rgba(212,182,118,0.15);
  --gold-text: #e8cc94;
  --text: #e8e4dc;
  --text-dim: rgba(232,228,220,0.45);
  --text-muted: rgba(232,228,220,0.25);
  --alive: #8fb89a;
  --alive-bg: rgba(143,184,154,0.12);
  --dull-bg: rgba(232,228,220,0.06);
  --dull: rgba(232,228,220,0.3);
  --radius: 10px;
  --font-body: 'EB Garamond', Georgia, serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 17px; }
body { overflow-x: hidden; }

.screen { display: none; min-height: 100vh; flex-direction: column; }
.screen.active { display: flex; }

.header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 56px 20px 16px;
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
}
.header-title { font-size: 13px; letter-spacing: .12em; color: var(--text-dim); font-family: var(--font-mono); text-transform: uppercase; }
.header-action { font-size: 13px; color: var(--gold); font-family: var(--font-mono); cursor: pointer; padding: 6px 0 6px 12px; }

.form-body { flex: 1; padding: 0 20px 40px; overflow-y: auto; }

.field { margin-top: 28px; }
.field-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-mono); margin-bottom: 10px; display: block; }

.dt-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.dt-input {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-mono); font-size: 14px;
  padding: 13px 12px; width: 100%;
  -webkit-appearance: none; appearance: none; color-scheme: dark;
}
.dt-input:focus { outline: none; border-color: var(--border-active); }

.dur-row { display: flex; align-items: center; gap: 10px; }
.dur-input {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-mono); font-size: 22px; font-weight: 500;
  padding: 13px 16px; width: 100px; text-align: center;
  -webkit-appearance: none; appearance: none;
}
.dur-input:focus { outline: none; border-color: var(--border-active); }
.dur-unit { color: var(--text-dim); font-size: 14px; }
.dur-btns { display: flex; gap: 6px; margin-left: auto; }
.dur-btn {
  width: 44px; height: 44px; border-radius: 50%;
  border: 0.5px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: border-color .1s, color .1s;
}
.dur-btn:active { border-color: var(--border-active); color: var(--gold); }

.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.chip {
  padding: 9px 16px; border-radius: 20px;
  border: 0.5px solid var(--border); background: transparent;
  color: var(--text-dim); font-family: var(--font-body); font-size: 15px;
  cursor: pointer; transition: all .12s;
}
.chip.on { border-color: var(--border-active); background: var(--gold-dim); color: var(--gold-text); }

.mantra-input {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-mono); font-size: 22px; font-weight: 500;
  padding: 13px 16px; width: 100%;
  -webkit-appearance: none; appearance: none; text-align: right;
}
.mantra-input:focus { outline: none; border-color: var(--border-active); }
.mantra-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.mantra-preset {
  padding: 6px 12px; border-radius: 14px;
  border: 0.5px solid var(--border); background: transparent;
  color: var(--text-dim); font-family: var(--font-mono); font-size: 12px;
  cursor: pointer; transition: all .12s;
}
.mantra-preset:active { border-color: var(--border-active); color: var(--gold); }

.divider-line { height: 0.5px; background: var(--border); margin: 24px 0 0; }

.stab-row { display: flex; gap: 8px; }
.stab-btn {
  flex: 1; height: 52px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-size: 20px; font-weight: 500;
  font-family: var(--font-mono); cursor: pointer; transition: all .12s;
}
.stab-btn.on { border-color: var(--border-active); background: var(--gold-dim); color: var(--gold-text); }
.stab-hint { font-size: 12px; color: var(--text-muted); margin-top: 7px; min-height: 16px; font-family: var(--font-mono); }

.conn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.conn-btn {
  height: 60px; border-radius: var(--radius);
  border: 0.5px solid var(--border); background: var(--surface);
  font-family: var(--font-body); font-size: 18px; cursor: pointer; transition: all .12s;
  color: var(--text-dim);
}
.conn-btn.on-alive { border-color: var(--alive); background: var(--alive-bg); color: var(--alive); }
.conn-btn.on-dull { border-color: rgba(232,228,220,0.2); background: var(--dull-bg); color: var(--dull); }

.save-btn {
  margin: 32px 20px 0; width: calc(100% - 40px);
  padding: 16px; border-radius: var(--radius);
  border: 0.5px solid var(--border-active);
  background: var(--gold-dim); color: var(--gold-text);
  font-family: var(--font-body); font-size: 18px; cursor: pointer;
  letter-spacing: .03em; transition: opacity .1s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.save-btn:active { opacity: .6; }
.save-btn.saving { opacity: .6; pointer-events: none; }
.spinner {
  width: 16px; height: 16px; border: 1.5px solid var(--gold-text);
  border-top-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite; display: none;
}
.save-btn.saving .spinner { display: block; }
.save-feedback { text-align: center; font-size: 13px; color: var(--text-muted); margin: 10px 20px 0; font-family: var(--font-mono); min-height: 18px; }
.sync-badge {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11px; font-family: var(--font-mono);
  padding: 3px 9px; border-radius: 8px; margin-top: 6px;
}
.sync-ok { background: var(--alive-bg); color: var(--alive); }
.sync-fail { background: rgba(220,80,80,0.12); color: #e07070; }
.sync-local { background: var(--gold-dim); color: var(--gold-text); }

@keyframes spin { to { transform: rotate(360deg); } }

.stats-bar {
  display: grid; grid-template-columns: 1fr 1fr 1fr;
  border-top: 0.5px solid var(--border);
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
}
.stat { padding: 14px 10px; text-align: center; }
.stat-val { font-family: var(--font-mono); font-size: 17px; font-weight: 500; color: var(--gold-text); }
.stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); margin-top: 3px; }

.hist-body { flex: 1; overflow-y: auto; padding-bottom: 40px; }
.hist-day-label { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-muted); font-family: var(--font-mono); padding: 20px 20px 8px; }
.hist-entry { padding: 14px 20px; border-bottom: 0.5px solid var(--border); display: flex; align-items: flex-start; gap: 14px; }
.hist-time { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); width: 40px; flex-shrink: 0; padding-top: 2px; }
.hist-main { flex: 1; }
.hist-type { font-size: 16px; color: var(--text); }
.hist-meta { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; align-items: center; }
.hist-dur { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
.hist-mantras { font-family: var(--font-mono); font-size: 12px; color: var(--gold); }
.hist-stab { font-family: var(--font-mono); font-size: 11px; padding: 2px 7px; border-radius: 8px; background: var(--gold-dim); color: var(--gold-text); }
.hist-alive { font-size: 11px; padding: 2px 7px; border-radius: 8px; background: var(--alive-bg); color: var(--alive); font-family: var(--font-mono); }
.hist-dull { font-size: 11px; padding: 2px 7px; border-radius: 8px; background: var(--dull-bg); color: var(--dull); font-family: var(--font-mono); }
.hist-sync { font-size: 10px; color: var(--text-muted); font-family: var(--font-mono); }

.empty-state { padding: 60px 20px; text-align: center; color: var(--text-muted); font-size: 15px; }

.setup-banner {
  margin: 20px; padding: 14px 16px;
  border: 0.5px solid var(--border-active);
  border-radius: var(--radius); background: var(--gold-dim);
}
.setup-banner p { font-size: 13px; color: var(--gold-text); line-height: 1.6; font-family: var(--font-mono); }
.setup-banner a { color: var(--gold); }
.setup-input {
  width: 100%; margin-top: 10px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: var(--font-mono); font-size: 12px;
  padding: 10px 12px;
}
.setup-input:focus { outline: none; border-color: var(--border-active); }
.setup-save-btn {
  margin-top: 8px; width: 100%; padding: 10px;
  border-radius: 6px; border: 0.5px solid var(--border-active);
  background: transparent; color: var(--gold-text);
  font-family: var(--font-mono); font-size: 12px; cursor: pointer;
}
</style>
</head>
<body>

<!-- LOG SCREEN -->
<div class="screen active" id="screen-log">
  <div class="header">
    <span class="header-title">Log session</span>
    <span class="header-action" onclick="showHistory()">History</span>
  </div>

  <div class="form-body">

    <div id="setup-area"></div>

    <div class="field">
      <span class="field-label">Date &amp; time</span>
      <div class="dt-row">
        <input class="dt-input" type="date" id="inp-date">
        <input class="dt-input" type="time" id="inp-time">
      </div>
    </div>

    <div class="field">
      <span class="field-label">Duration</span>
      <div class="dur-row">
        <input class="dur-input" type="number" id="inp-dur" min="1" max="600" placeholder="60">
        <span class="dur-unit">min</span>
        <div class="dur-btns">
          <button class="dur-btn" onclick="adjDur(-5)">−</button>
          <button class="dur-btn" onclick="adjDur(5)">+</button>
        </div>
      </div>
    </div>

    <div class="field">
      <span class="field-label">Practice type</span>
      <div class="chips" id="type-chips">
        <div class="chip on" onclick="setType(this)">Daily practice</div>
        <div class="chip" onclick="setType(this)">Ritual</div>
        <div class="chip" onclick="setType(this)">Prayer</div>
        <div class="chip" onclick="setType(this)">Teaching</div>
        <div class="chip" onclick="setType(this)">Reading</div>
      </div>
    </div>

    <div class="field" id="mantra-field">
      <span class="field-label">Mantras accumulated</span>
      <input class="mantra-input" type="number" id="inp-mantras" placeholder="0" min="0">
      <div class="mantra-presets">
        <button class="mantra-preset" onclick="setMantras(3000)">3k</button>
        <button class="mantra-preset" onclick="setMantras(5000)">5k</button>
        <button class="mantra-preset" onclick="setMantras(7000)">7k</button>
        <button class="mantra-preset" onclick="setMantras(9000)">9k</button>
        <button class="mantra-preset" onclick="setMantras(11000)">11k</button>
        <button class="mantra-preset" onclick="setMantras(15000)">15k</button>
      </div>
    </div>

    <div class="divider-line"></div>

    <div class="field">
      <span class="field-label">Stability</span>
      <div class="stab-row" id="stab-row">
        <button class="stab-btn" data-v="1" onclick="setStab(1)">1</button>
        <button class="stab-btn" data-v="2" onclick="setStab(2)">2</button>
        <button class="stab-btn" data-v="3" onclick="setStab(3)">3</button>
        <button class="stab-btn" data-v="4" onclick="setStab(4)">4</button>
        <button class="stab-btn" data-v="5" onclick="setStab(5)">5</button>
      </div>
      <div class="stab-hint" id="stab-hint">1 coarse · 2 medium · 3 subtle · 4 stable · 5 effortless</div>
    </div>

    <div class="field">
      <span class="field-label">Connection</span>
      <div class="conn-row">
        <button class="conn-btn" id="btn-alive" onclick="setConn('alive')">Alive</button>
        <button class="conn-btn" id="btn-dull" onclick="setConn('dull')">Dull</button>
      </div>
    </div>

  </div>

  <button class="save-btn" id="save-btn" onclick="saveSession()">
    <span class="spinner" id="spinner"></span>
    <span id="save-label">Save session</span>
  </button>
  <div class="save-feedback" id="save-fb"></div>
  <div style="height:24px"></div>
</div>

<!-- HISTORY SCREEN -->
<div class="screen" id="screen-hist">
  <div class="header">
    <span class="header-title">Sessions</span>
    <span class="header-action" onclick="showLog()">+ Log</span>
  </div>
  <div class="stats-bar">
    <div class="stat"><div class="stat-val" id="stat-total">0</div><div class="stat-label">today</div></div>
    <div class="stat"><div class="stat-val" id="stat-mantras">0</div><div class="stat-label">mantras</div></div>
    <div class="stat"><div class="stat-val" id="stat-stab">—</div><div class="stat-label">avg stab</div></div>
  </div>
  <div class="hist-body" id="hist-body"></div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────
var SHEET_URL = localStorage.getItem('sheet_url') || '';

// ── STATE ───────────────────────────────────────────────
var stab = 0, conn = '', practiceType = 'Daily practice';
var stabHints = {
  1:'fully away — coarse excitation',
  2:'object at periphery — medium',
  3:'present but subtle imbalance',
  4:'stable — minor effort only',
  5:'effortless'
};

// ── INIT ────────────────────────────────────────────────
function init() {
  initDateTime();
  renderSetupArea();
}

function initDateTime() {
  var now = new Date();
  var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
  document.getElementById('inp-date').value = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  document.getElementById('inp-time').value = pad(now.getHours())+':'+pad(now.getMinutes());
}

function renderSetupArea() {
  var area = document.getElementById('setup-area');
  if (SHEET_URL) {
    area.innerHTML = '';
    return;
  }
  area.innerHTML = '<div class="setup-banner"><p>Paste your Apps Script URL below to enable Google Sheets sync. See setup instructions.</p><input class="setup-input" id="url-inp" placeholder="https://script.google.com/macros/s/..." /><button class="setup-save-btn" onclick="saveSheetUrl()">Save URL</button></div>';
}

function saveSheetUrl() {
  var v = document.getElementById('url-inp').value.trim();
  if (!v) return;
  SHEET_URL = v;
  localStorage.setItem('sheet_url', v);
  renderSetupArea();
  showFeedback('Sheet URL saved');
}

// ── FORM CONTROLS ────────────────────────────────────────
function adjDur(d) {
  var el = document.getElementById('inp-dur');
  el.value = Math.max(1, Math.min(600, (parseInt(el.value)||0) + d));
}

function setType(el) {
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  el.classList.add('on');
  practiceType = el.textContent.trim();
  document.getElementById('mantra-field').style.opacity = practiceType === 'Daily practice' ? '1' : '0.5';
}

function setMantras(v) { document.getElementById('inp-mantras').value = v; }

function setStab(v) {
  stab = v;
  document.querySelectorAll('.stab-btn').forEach(function(b){ b.classList.toggle('on', +b.dataset.v === v); });
  document.getElementById('stab-hint').textContent = stabHints[v];
}

function setConn(c) {
  conn = c;
  document.getElementById('btn-alive').className = 'conn-btn' + (c==='alive' ? ' on-alive' : '');
  document.getElementById('btn-dull').className  = 'conn-btn' + (c==='dull'  ? ' on-dull'  : '');
}

// ── SAVE ─────────────────────────────────────────────────
function saveSession() {
  var date    = document.getElementById('inp-date').value;
  var time    = document.getElementById('inp-time').value;
  var dur     = parseInt(document.getElementById('inp-dur').value) || 0;
  var mantras = parseInt(document.getElementById('inp-mantras').value) || 0;

  if (!date || !dur) { showFeedback('add date and duration'); return; }

  var entry = {
    id: Date.now(),
    date: date, time: time,
    dur: dur, type: practiceType,
    mantras: mantras, stab: stab, conn: conn,
    synced: false
  };

  saveLocal(entry);
  showFeedback('saved locally');
  setSaving(true);

  if (SHEET_URL) {
    sendToSheet(entry, function(ok) {
      setSaving(false);
      if (ok) {
        markSynced(entry.id);
        showFeedback('synced to Sheet');
      } else {
        showFeedback('saved — sync failed, will retry');
      }
      setTimeout(function(){ resetForm(); }, 1400);
    });
  } else {
    setSaving(false);
    setTimeout(function(){ resetForm(); }, 1000);
  }
}

function sendToSheet(entry, cb) {
  var params = [
    'date='    + encodeURIComponent(entry.date),
    'time='    + encodeURIComponent(entry.time),
    'dur='     + entry.dur,
    'type='    + encodeURIComponent(entry.type),
    'mantras=' + entry.mantras,
    'stab='    + entry.stab,
    'conn='    + encodeURIComponent(entry.conn)
  ].join('&');

  var url = SHEET_URL + '?' + params;

  var img = new Image();
  var done = false;
  var timeout = setTimeout(function(){
    if (!done) { done = true; cb(false); }
  }, 8000);

  img.onload = img.onerror = function(e) {
    if (!done) {
      done = true;
      clearTimeout(timeout);
      cb(e.type === 'load');
    }
  };
  img.src = url;
}

function setSaving(on) {
  var btn = document.getElementById('save-btn');
  btn.classList.toggle('saving', on);
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('save-label').textContent = on ? 'Syncing...' : 'Save session';
}

// ── LOCAL STORAGE ────────────────────────────────────────
function loadAll() {
  try { return JSON.parse(localStorage.getItem('prac_log') || '[]'); } catch(e) { return []; }
}

function saveLocal(entry) {
  var data = loadAll();
  data.unshift(entry);
  try { localStorage.setItem('prac_log', JSON.stringify(data)); } catch(e) {}
}

function markSynced(id) {
  var data = loadAll();
  data.forEach(function(e){ if (e.id === id) e.synced = true; });
  try { localStorage.setItem('prac_log', JSON.stringify(data)); } catch(e) {}
}

// ── RESET ────────────────────────────────────────────────
function resetForm() {
  initDateTime();
  document.getElementById('inp-dur').value = '';
  document.getElementById('inp-mantras').value = '';
  stab = 0; conn = '';
  document.querySelectorAll('.stab-btn').forEach(function(b){ b.classList.remove('on'); });
  document.getElementById('stab-hint').textContent = '1 coarse · 2 medium · 3 subtle · 4 stable · 5 effortless';
  document.getElementById('btn-alive').className = 'conn-btn';
  document.getElementById('btn-dull').className  = 'conn-btn';
  document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('on'); });
  document.querySelector('.chip').classList.add('on');
  practiceType = 'Daily practice';
  document.getElementById('mantra-field').style.opacity = '1';
  document.getElementById('save-fb').textContent = '';
}

function showFeedback(msg) { document.getElementById('save-fb').textContent = msg; }

// ── HISTORY ──────────────────────────────────────────────
function showHistory() {
  document.getElementById('screen-log').classList.remove('active');
  document.getElementById('screen-hist').classList.add('active');
  renderHistory();
}

function showLog() {
  document.getElementById('screen-hist').classList.remove('active');
  document.getElementById('screen-log').classList.add('active');
}

function renderHistory() {
  var data = loadAll();
  var body = document.getElementById('hist-body');
  if (!data.length) { body.innerHTML = '<div class="empty-state">No sessions yet</div>'; updateStats(data); return; }
  updateStats(data);

  var grouped = {};
  data.forEach(function(e){ if (!grouped[e.date]) grouped[e.date] = []; grouped[e.date].push(e); });

  var today = new Date().toISOString().slice(0,10);
  var html = '';
  Object.keys(grouped).sort().reverse().forEach(function(date) {
    var label = date === today ? 'Today' : formatDate(date);
    html += '<div class="hist-day-label">' + label + '</div>';
    grouped[date].forEach(function(e) {
      html += '<div class="hist-entry">';
      html += '<div class="hist-time">' + (e.time||'') + '</div>';
      html += '<div class="hist-main"><div class="hist-type">' + e.type + '</div>';
      html += '<div class="hist-meta">';
      html += '<span class="hist-dur">' + e.dur + 'min</span>';
      if (e.mantras) html += '<span class="hist-mantras">' + e.mantras.toLocaleString() + '</span>';
      if (e.stab)    html += '<span class="hist-stab">s' + e.stab + '</span>';
      if (e.conn)    html += '<span class="hist-' + e.conn + '">' + e.conn + '</span>';
      if (SHEET_URL) html += '<span class="hist-sync">' + (e.synced ? '↑' : '○') + '</span>';
      html += '</div></div></div>';
    });
  });
  body.innerHTML = html;
}

function updateStats(data) {
  var today = new Date().toISOString().slice(0,10);
  var td = data.filter(function(e){ return e.date === today; });
  var tm = td.reduce(function(s,e){ return s+(e.mantras||0); }, 0);
  var se = data.filter(function(e){ return e.stab; }).slice(0,20);
  var as = se.length ? (se.reduce(function(s,e){ return s+e.stab; },0)/se.length).toFixed(1) : '—';
  document.getElementById('stat-total').textContent   = td.length;
  document.getElementById('stat-mantras').textContent = tm ? tm.toLocaleString() : '0';
  document.getElementById('stat-stab').textContent    = as;
}

function formatDate(d) {
  var p = d.split('-');
  var m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return parseInt(p[2]) + ' ' + m[parseInt(p[1])-1];
}

init();
</script>
</body>
