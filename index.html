<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mantras">
<title>Mantra Log</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0d0b;
  --surface: #161512;
  --border: rgba(255,255,255,0.07);
  --border-active: rgba(212,182,118,0.5);
  --gold: #d4b676;
  --gold-dim: rgba(212,182,118,0.15);
  --gold-text: #e8cc94;
  --text: #e8e4dc;
  --text-dim: rgba(232,228,220,0.45);
  --text-muted: rgba(232,228,220,0.25);
  --radius: 10px;
  --font-body: 'EB Garamond', Georgia, serif;
  --font-mono: 'DM Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 17px; }

.screen { display: flex; min-height: 100vh; flex-direction: column; }

.header {
  padding: 56px 20px 14px;
  border-bottom: 0.5px solid var(--border);
  flex-shrink: 0;
}
.header-title { font-size: 13px; letter-spacing: .12em; color: var(--text-dim); font-family: var(--font-mono); text-transform: uppercase; }

.form-body { flex: 1; padding: 0 20px 40px; overflow-y: auto; }

.field { margin-top: 30px; }
.field-label {
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--text-muted); font-family: var(--font-mono);
  margin-bottom: 10px; display: block;
}

.dt-input {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-mono); font-size: 16px;
  padding: 14px 14px; width: 100%;
  -webkit-appearance: none; appearance: none; color-scheme: dark;
}
.dt-input:focus { outline: none; border-color: var(--border-active); }

.mantra-input {
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: var(--radius); color: var(--text);
  font-family: var(--font-mono); font-size: 34px; font-weight: 500;
  padding: 20px 18px; width: 100%;
  -webkit-appearance: none; appearance: none; text-align: center;
}
.mantra-input:focus { outline: none; border-color: var(--border-active); }
.mantra-input::placeholder { color: var(--text-muted); }

.mantra-controls { display: flex; gap: 8px; margin-top: 10px; }
.mantra-preset {
  flex: 1; padding: 11px 0; border-radius: 14px;
  border: 0.5px solid var(--border); background: transparent;
  color: var(--text-dim); font-family: var(--font-mono); font-size: 14px;
  cursor: pointer; transition: all .12s;
}
.mantra-preset:active { border-color: var(--border-active); color: var(--gold); }
.mantra-adj {
  width: 46px; flex-shrink: 0; border-radius: 14px;
  border: 0.5px solid var(--border); background: var(--surface);
  color: var(--text-dim); font-size: 18px; cursor: pointer;
  font-family: var(--font-mono); transition: border-color .1s, color .1s;
}
.mantra-adj:active { border-color: var(--border-active); color: var(--gold); }

.save-btn {
  margin: 40px 0 0; width: 100%;
  padding: 18px; border-radius: var(--radius);
  border: 0.5px solid var(--border-active);
  background: var(--gold-dim); color: var(--gold-text);
  font-family: var(--font-body); font-size: 19px; cursor: pointer;
  letter-spacing: .03em; transition: opacity .1s;
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.save-btn:active { opacity: .6; }
.save-btn.saving { opacity: .6; pointer-events: none; }
.spinner {
  width: 16px; height: 16px; border: 1.5px solid var(--gold-text);
  border-top-color: transparent; border-radius: 50%;
  animation: spin .7s linear infinite; display: none;
}
.save-btn.saving .spinner { display: block; }
@keyframes spin { to { transform: rotate(360deg); } }
.save-feedback { text-align: center; font-size: 13px; color: var(--text-muted); margin: 14px 0 0; font-family: var(--font-mono); min-height: 18px; }

.today-stat {
  margin-top: 30px; padding-top: 20px; border-top: 0.5px solid var(--border);
  text-align: center;
}
.today-stat-val { font-family: var(--font-mono); font-size: 20px; font-weight: 500; color: var(--gold-text); }
.today-stat-label { font-size: 10px; color: var(--text-muted); letter-spacing: .08em; text-transform: uppercase; font-family: var(--font-mono); margin-top: 4px; }

.setup-banner {
  margin: 20px 0 0; padding: 14px 16px;
  border: 0.5px solid var(--border-active);
  border-radius: var(--radius); background: var(--gold-dim);
}
.setup-banner p { font-size: 13px; color: var(--gold-text); line-height: 1.6; font-family: var(--font-mono); }
.setup-input {
  width: 100%; margin-top: 10px;
  background: var(--surface); border: 0.5px solid var(--border);
  border-radius: 6px; color: var(--text);
  font-family: var(--font-mono); font-size: 12px; padding: 10px 12px;
}
.setup-input:focus { outline: none; border-color: var(--border-active); }
.setup-save-btn {
  margin-top: 8px; width: 100%; padding: 10px;
  border-radius: 6px; border: 0.5px solid var(--border-active);
  background: transparent; color: var(--gold-text);
  font-family: var(--font-mono); font-size: 12px; cursor: pointer;
}
</style>
</head>
<body>

<div class="screen">
  <div class="header">
    <span class="header-title">Log mantras</span>
  </div>

  <div class="form-body">

    <div id="setup-area"></div>

    <div class="field">
      <span class="field-label">Date</span>
      <input class="dt-input" type="date" id="inp-date">
    </div>

    <div class="field">
      <span class="field-label">Mantras</span>
      <input class="mantra-input" type="number" id="inp-mantras" placeholder="0" min="0" inputmode="numeric">
      <div class="mantra-controls">
        <button class="mantra-adj" onclick="adjMantras(-1000)">−</button>
        <button class="mantra-preset" onclick="setMantras(3000)">3k</button>
        <button class="mantra-preset" onclick="setMantras(10000)">10k</button>
        <button class="mantra-adj" onclick="adjMantras(1000)">+</button>
      </div>
    </div>

    <button class="save-btn" id="save-btn" onclick="saveEntry()">
      <span class="spinner" id="spinner"></span>
      <span id="save-label">Save</span>
    </button>
    <div class="save-feedback" id="save-fb"></div>

    <div class="today-stat">
      <div class="today-stat-val" id="stat-today">—</div>
      <div class="today-stat-label" id="stat-today-label">mantras today</div>
    </div>

  </div>
</div>

<script>
// ── STATE ────────────────────────────────────────────────
var SHEET_URL = localStorage.getItem('sheet_url_v2') || '';

// ── INIT ─────────────────────────────────────────────────
function init() {
  initDate();
  renderSetupArea();
  updateTodayStat();
}

function initDate() {
  var now = new Date();
  var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
  document.getElementById('inp-date').value = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
}

function renderSetupArea() {
  var area = document.getElementById('setup-area');
  if (SHEET_URL) { area.innerHTML = ''; return; }
  area.innerHTML = '<div class="setup-banner"><p>Paste your Apps Script URL to enable Google Sheets sync.</p><input class="setup-input" id="url-inp" placeholder="https://script.google.com/macros/s/..."/><button class="setup-save-btn" onclick="saveSheetUrl()">Save URL</button></div>';
}

function saveSheetUrl() {
  var v = document.getElementById('url-inp').value.trim();
  if (!v) return;
  SHEET_URL = v;
  localStorage.setItem('sheet_url_v2', v);
  renderSetupArea();
}

// ── CONTROLS ─────────────────────────────────────────────
function setMantras(v) { document.getElementById('inp-mantras').value = v; }

function adjMantras(d) {
  var el = document.getElementById('inp-mantras');
  el.value = Math.max(0, (parseInt(el.value)||0) + d);
}

// ── SAVE ─────────────────────────────────────────────────
function saveEntry() {
  var date    = document.getElementById('inp-date').value;
  var mantras = parseInt(document.getElementById('inp-mantras').value) || 0;
  if (!date || !mantras) { showFeedback('add date and mantras'); return; }

  var entry = { id: Date.now(), date: date, mantras: mantras, synced: false };

  saveLocal(entry);
  updateTodayStat();
  showFeedback('saved');
  setSaving(true);

  if (SHEET_URL) {
    sendToSheet(entry, function(ok) {
      setSaving(false);
      if (ok) { markSynced(entry.id); showFeedback('synced ↑'); }
      else { showFeedback('saved — sync failed'); }
      setTimeout(resetForm, 1200);
    });
  } else {
    setSaving(false);
    setTimeout(resetForm, 900);
  }
}

function sendToSheet(entry, cb) {
  var params = [
    'date='    + encodeURIComponent(entry.date),
    'mantras=' + entry.mantras
  ].join('&');

  // no-cors responses are opaque — we can't read status, so assume success if no network error
  fetch(SHEET_URL + '?' + params, { method: 'GET', mode: 'no-cors' })
    .then(function(){ cb(true); })
    .catch(function(){
      var img = new Image();
      img.onload = img.onerror = function(){ cb(true); };
      img.src = SHEET_URL + '?' + params + '&t=' + Date.now();
    });
}

function setSaving(on) {
  document.getElementById('save-btn').classList.toggle('saving', on);
  document.getElementById('spinner').style.display = on ? 'block' : 'none';
  document.getElementById('save-label').textContent = on ? 'Syncing...' : 'Save';
}

// ── LOCAL STORAGE ────────────────────────────────────────
function loadAll() {
  try { return JSON.parse(localStorage.getItem('mantra_log')||'[]'); } catch(e){ return []; }
}
function saveLocal(entry) {
  var d = loadAll(); d.unshift(entry);
  try { localStorage.setItem('mantra_log', JSON.stringify(d)); } catch(e){}
}
function markSynced(id) {
  var d = loadAll();
  d.forEach(function(e){ if(e.id===id) e.synced=true; });
  try { localStorage.setItem('mantra_log', JSON.stringify(d)); } catch(e){}
}

// ── STATS ────────────────────────────────────────────────
function updateTodayStat() {
  var now = new Date();
  var pad = function(n){ return n < 10 ? '0'+n : ''+n; };
  var today = now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  var all = loadAll();
  var td = all.filter(function(e){ return e.date === today; });
  var total = td.reduce(function(s,e){ return s+(e.mantras||0); }, 0);
  document.getElementById('stat-today').textContent = total ? total.toLocaleString() : '—';
  document.getElementById('stat-today-label').textContent = td.length + (td.length===1 ? ' entry today' : ' entries today');
}

// ── RESET ────────────────────────────────────────────────
function resetForm() {
  initDate();
  document.getElementById('inp-mantras').value = '';
  document.getElementById('save-fb').textContent = '';
}

function showFeedback(msg) { document.getElementById('save-fb').textContent = msg; }

init();
</script>

</body>
</html>
